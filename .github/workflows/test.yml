name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  qq:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/qq
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
